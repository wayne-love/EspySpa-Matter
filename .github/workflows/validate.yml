name: Validate ESP32-C6 migration
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.classify.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/ci_policy.py --base "$BASE_SHA" --head HEAD >> "$GITHUB_OUTPUT"
          else
            echo 'firmware=true' >> "$GITHUB_OUTPUT"
          fi
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace
        run: git diff-tree --check HEAD
      - name: Check workflow syntax and shell expressions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Test packaging guard failures
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh
        env:
          CXX: ${{ matrix.compiler }}
  firmware:
    needs: [changes, quality, protocol]
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.4.2
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-esp32c6-idf5.4.1-matter4cedd4ad-${{ hashFiles('sdkconfig.defaults', 'main/idf_component.yml', 'main/CHIPProjectConfig.h', 'partitions.csv', '.github/workflows/validate.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-esp32c6-idf5.4.1-matter4cedd4ad-${{ hashFiles('sdkconfig.defaults', 'main/idf_component.yml', 'main/CHIPProjectConfig.h', 'partitions.csv', '.github/workflows/validate.yml') }}-
      - name: Build Matter over Thread firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "$ESP_MATTER_PATH"
          git config --global --add safe.directory "$ESP_MATTER_PATH"
          git fetch --depth 1 origin 4cedd4ad40821933d6cc237e80ab6604f2953fb0
          git checkout --detach FETCH_HEAD
          git submodule update --init --depth 1
          cd "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          source "$ESP_MATTER_PATH/export.sh"
          ccache --zero-stats
          idf.py set-target esp32c6
          idf.py build
          ccache --show-stats
      - name: Check generated configuration, images and OTA space
        run: python3 scripts/check_build.py
      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: espyspa-matter-quality-esp32c6
          path: build/quality-report.json
          if-no-files-found: error
      - name: Upload flashing images
        uses: actions/upload-artifact@v4
        with:
          name: espyspa-matter-development-esp32c6
          path: |
            build/espyspa_matter.bin
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: espyspa-matter-debug-esp32c6
          path: build/espyspa_matter.elf
          if-no-files-found: error
  quality-gate:
    if: ${{ always() }}
    needs: [changes, quality, protocol, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require all checks to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          PROTOCOL: ${{ needs.protocol.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          CHANGES: ${{ needs.changes.result }}
          FIRMWARE_REQUIRED: ${{ needs.changes.outputs.firmware }}
        run: python3 scripts/ci_policy.py --gate
