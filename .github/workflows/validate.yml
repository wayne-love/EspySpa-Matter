name: Validate ESP32-C6 migration
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
concurrency:
  group: validate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      firmware: ${{ steps.classify.outputs.firmware }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Classify changed files
        id: classify
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            python3 scripts/ci_policy.py --base "$BASE_SHA" --head HEAD >> "$GITHUB_OUTPUT"
          else
            echo 'firmware=true' >> "$GITHUB_OUTPUT"
          fi
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Check whitespace
        run: git diff-tree --check HEAD
      - name: Check workflow syntax and shell expressions
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.7 -color
      - name: Test packaging guard failures
        run: python3 -m unittest discover -s tests -p '*_test.py' -v
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        compiler: [g++, clang++]
    steps:
      - uses: actions/checkout@v4
      - run: tests/run.sh
        env:
          CXX: ${{ matrix.compiler }}
  firmware:
    needs: [changes, quality, protocol]
    if: ${{ needs.changes.outputs.firmware == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    container: espressif/esp-matter:release-v1.4.2
    env:
      IDF_CCACHE_ENABLE: '1'
      CCACHE_DIR: ${{ github.workspace }}/.ccache
      CCACHE_BASEDIR: ${{ github.workspace }}
      CCACHE_MAXSIZE: 500M
    steps:
      - uses: actions/checkout@v4
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-v1-${{ runner.os }}-esp32c6-idf5.4.1-matter4cedd4ad-${{ hashFiles('sdkconfig.defaults', 'main/idf_component.yml', 'main/CHIPProjectConfig.h', 'partitions.csv', '.github/workflows/validate.yml') }}-${{ github.sha }}
          restore-keys: |
            ccache-v1-${{ runner.os }}-esp32c6-idf5.4.1-matter4cedd4ad-${{ hashFiles('sdkconfig.defaults', 'main/idf_component.yml', 'main/CHIPProjectConfig.h', 'partitions.csv', '.github/workflows/validate.yml') }}-
      - name: Select firmware identity
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA:0:7}"
          if [[ "$GITHUB_REF_TYPE" == "tag" && "$GITHUB_REF_NAME" == v* ]]; then
            version="${GITHUB_REF_NAME#v}"
            channel="release"
            asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          else
            version="0.1.0-dev.${GITHUB_RUN_NUMBER}+${short_sha}"
            channel="development"
            asset_base="https://github.com/${GITHUB_REPOSITORY}/releases/download/development"
          fi
          echo "ESPYSPA_VERSION=$version" >> "$GITHUB_ENV"
          echo "ESPYSPA_CHANNEL=$channel" >> "$GITHUB_ENV"
          echo "ESPYSPA_GIT_COMMIT=$short_sha" >> "$GITHUB_ENV"
          echo "ESPYSPA_ASSET_BASE=$asset_base" >> "$GITHUB_ENV"

      - name: Build Matter over Thread firmware
        shell: bash
        run: |
          set -euo pipefail
          cd "$ESP_MATTER_PATH"
          git config --global --add safe.directory "$ESP_MATTER_PATH"
          git fetch --depth 1 origin 4cedd4ad40821933d6cc237e80ab6604f2953fb0
          git checkout --detach FETCH_HEAD
          git submodule update --init --depth 1
          cd "$GITHUB_WORKSPACE"
          source "$IDF_PATH/export.sh"
          source "$ESP_MATTER_PATH/export.sh"
          ccache --zero-stats
          idf.py set-target esp32c6
          idf.py build
          ccache --show-stats
      - name: Check generated configuration, images and OTA space
        run: python3 scripts/check_build.py

      - name: Build OTA manifest
        shell: bash
        run: |
          set -euo pipefail
          cp build/espyspa_matter.bin build/espyspa-matter.bin
          python3 scripts/make_manifest.py \
            --image build/espyspa-matter.bin \
            --version "$ESPYSPA_VERSION" \
            --channel "$ESPYSPA_CHANNEL" \
            --commit "$ESPYSPA_GIT_COMMIT" \
            --url "$ESPYSPA_ASSET_BASE/espyspa-matter.bin" \
            --output build/manifest.json

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: espyspa-matter-quality-esp32c6
          path: build/quality-report.json
          if-no-files-found: error
      - name: Upload flashing images
        uses: actions/upload-artifact@v4
        with:
          name: espyspa-matter-development-esp32c6
          path: |
            build/espyspa_matter.bin
            build/espyspa-matter.bin
            build/manifest.json
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/ota_data_initial.bin
            build/flasher_args.json
          if-no-files-found: error
      - name: Upload debug symbols
        uses: actions/upload-artifact@v4
        with:
          name: espyspa-matter-debug-esp32c6
          path: build/espyspa_matter.elf
          if-no-files-found: error
  publish-development:
    needs: [firmware, quality-gate]
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          name: espyspa-matter-development-esp32c6
          path: package
      - name: Publish moving development release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if git rev-parse refs/tags/development >/dev/null 2>&1; then
            git tag -f development "$GITHUB_SHA"
            git push --force origin refs/tags/development
          else
            git tag development "$GITHUB_SHA"
            git push origin refs/tags/development
          fi

          if gh release view development >/dev/null 2>&1; then
            gh release edit development --prerelease --title "Development firmware" \
              --notes "Latest successful build from main. This image may contain unfinished changes."
          else
            gh release create development --prerelease --title "Development firmware" \
              --notes "Latest successful build from main. This image may contain unfinished changes."
          fi

          gh release upload development \
            package/espyspa-matter.bin \
            package/manifest.json \
            --clobber

  publish-release:
    needs: [firmware, quality-gate]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v') && needs.quality-gate.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: espyspa-matter-development-esp32c6
          path: package
      - name: Publish release firmware
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="$GITHUB_REF_NAME"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$tag" package/espyspa-matter.bin package/manifest.json \
              --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$tag" package/espyspa-matter.bin package/manifest.json \
              --verify-tag --generate-notes --title "$tag" --repo "$GITHUB_REPOSITORY"
          fi

  quality-gate:
    if: ${{ always() }}
    needs: [changes, quality, protocol, firmware]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Require all checks to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          PROTOCOL: ${{ needs.protocol.result }}
          FIRMWARE: ${{ needs.firmware.result }}
          CHANGES: ${{ needs.changes.result }}
          FIRMWARE_REQUIRED: ${{ needs.changes.outputs.firmware }}
        run: python3 scripts/ci_policy.py --gate
